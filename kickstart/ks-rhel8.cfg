# ==============================================================================
# RHEL 8 golden image kickstart (boot ISO, UEFI). Minimal OS + what a test VM needs:
# cloud-init (login and registration per VM), qemu-guest-agent, python3 (Ansible).
#
# Placeholders, filled in by rhel.pkr.hcl (never commit values):
#   @@RHSM_ORG@@, @@RHSM_ACTIVATION_KEY@@   Red Hat registration; the boot ISO installs from the CDN
#   @@PACKER_SSH_PUBKEY@@                   key of the temporary build user, removed at the end
# ==============================================================================

# ---- Installer ------------------------------------------------------------------
text
eula --agreed
skipx
firstboot --disable
reboot --eject

# Register during the install; the installation source is then the Red Hat CDN.
rhsm --organization="@@RHSM_ORG@@" --activation-key="@@RHSM_ACTIVATION_KEY@@"

# ---- Localization -----------------------------------------------------------------
lang en_US.UTF-8
keyboard --xlayouts='us'
timezone UTC --utc

# ---- Network ----------------------------------------------------------------------
# DHCP, generic hostname: cloud-init sets the real one per VM.
network --bootproto=dhcp --device=link --onboot=yes --activate --hostname=rhel8-golden

# ---- Security baseline ------------------------------------------------------------
selinux --enforcing
firewall --enabled --service=ssh
services --enabled=sshd,qemu-guest-agent

# ---- Accounts ---------------------------------------------------------------------
# Root locked; cloud-init adds the key of each test VM.
rootpw --lock
# Temporary build user for Packer; removed by Packer's shutdown command.
user --name=packer --groups=wheel --lock
sshkey --username=packer "@@PACKER_SSH_PUBKEY@@"
# General-use image only: Packer puts the admin user (frqadmin) on the line below, or leaves it empty.
#@@ADMIN_USER@@

# ---- Disk: UEFI (GPT) + LVM ---------------------------------------------------------
zerombr
ignoredisk --only-use=vda
clearpart --all --initlabel --disklabel=gpt --drives=vda
bootloader --location=mbr --boot-drive=vda

# /boot/efi and /boot stay outside LVM: firmware and GRUB read them before LVM exists.
part /boot/efi --fstype=efi --size=600
part /boot     --fstype=xfs --size=1024
# The PV takes the rest of the disk; the LVs below have fixed sizes, so about 1.5 GB stays free in vg_sys for an
# lvextend on a test VM (lvextend -r -L +1G vg_sys/lv_var), or more after growing the VM disk (growpart + pvresize).
part pv.01     --size=1 --grow
volgroup vg_sys pv.01

# Separate /tmp, /var, /var/tmp, /var/log, /var/log/audit, /home: the layout the CIS OS benchmarks check, so the image
# also serves OS hardening roles; a full log or temp folder cannot fill /.
logvol /               --vgname=vg_sys --name=lv_root   --fstype=xfs  --size=8192
logvol /home           --vgname=vg_sys --name=lv_home   --fstype=xfs  --size=1024
logvol /tmp            --vgname=vg_sys --name=lv_tmp    --fstype=xfs  --size=1024
logvol /var            --vgname=vg_sys --name=lv_var    --fstype=xfs  --size=3072
logvol /var/tmp        --vgname=vg_sys --name=lv_vartmp --fstype=xfs  --size=1024
logvol /var/log        --vgname=vg_sys --name=lv_varlog --fstype=xfs  --size=1024
logvol /var/log/audit  --vgname=vg_sys --name=lv_audit  --fstype=xfs  --size=1024
logvol swap            --vgname=vg_sys --name=lv_swap   --fstype=swap --size=1024

%addon com_redhat_kdump --disable
%end

# ---- Packages ---------------------------------------------------------------------
%packages
@^minimal-environment
cloud-init
qemu-guest-agent
# python3 is 3.6 on RHEL 8: ansible-core 2.16 still manages it, 2.17 and later need python3.11 or newer
python3
%end

# ---- Build user sudo (removed with the user) ---------------------------------------
%post
echo 'packer ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/packer
chmod 0440 /etc/sudoers.d/packer
%end
